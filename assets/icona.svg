<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Cinemone: biglietto del cinema su sfondo pesca-rosa (icona quadrata: iOS arrotonda gli angoli da sé) -->
  <defs>
    <linearGradient id="sfondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc082"/>
      <stop offset="0.5" stop-color="#ff9a8c"/>
      <stop offset="1" stop-color="#ff6faa"/>
    </linearGradient>
    <radialGradient id="luce" cx="0.22" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="biglietto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2730"/>
      <stop offset="1" stop-color="#121114"/>
    </linearGradient>
    <mask id="tacche">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <circle cx="212" cy="512" r="58" fill="#000"/>
      <circle cx="812" cy="512" r="58" fill="#000"/>
      <circle cx="640" cy="300" r="34" fill="#000"/>
      <circle cx="640" cy="724" r="34" fill="#000"/>
    </mask>
    <filter id="ombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#7a1d3c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#sfondo)"/>
  <rect width="1024" height="1024" fill="url(#luce)"/>

  <g transform="rotate(-9 512 512)" filter="url(#ombra)">
    <rect x="212" y="300" width="600" height="424" rx="64" fill="url(#biglietto)" mask="url(#tacche)"/>
    <!-- perforazione della matrice -->
    <line x1="640" y1="358" x2="640" y2="666" stroke="#ff9a8c" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 34" opacity="0.9"/>
    <!-- la "C" di Cinemone -->
    <path d="M 518 418 A 118 118 0 1 0 518 606" fill="none" stroke="#fff" stroke-width="66" stroke-linecap="round"/>
    <!-- stellina sulla matrice -->
    <path d="M 726 462 l 15 32 l 35 4 l -26 24 l 7 35 l -31 -18 l -31 18 l 7 -35 l -26 -24 l 35 -4 z" fill="#ffb197"/>
  </g>
</svg>
