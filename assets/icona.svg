<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- OneScreen: tre schermi sovrapposti in prospettiva, dal blu notte all'oro, con il play (dal logo proposto) -->
  <defs>
    <radialGradient id="fondo" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#0e1740"/>
      <stop offset="1" stop-color="#050a1f"/>
    </radialGradient>
    <linearGradient id="dietro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a52a8"/>
      <stop offset="1" stop-color="#121c4a"/>
    </linearGradient>
    <linearGradient id="mezzo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c873"/>
      <stop offset="0.55" stop-color="#8a6a52"/>
      <stop offset="1" stop-color="#1b2556"/>
    </linearGradient>
    <linearGradient id="davanti" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6ad55"/>
      <stop offset="0.6" stop-color="#f3c66f"/>
      <stop offset="1" stop-color="#fbe0a0"/>
    </linearGradient>
    <filter id="luce" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="26" flood-color="#f0b95a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#fondo)"/>

  <!-- schermo dietro (blu) -->
  <path d="M 262 316 L 600 372 L 600 652 L 262 708 Z" fill="url(#dietro)" stroke="url(#dietro)"
        stroke-width="64" stroke-linejoin="round" opacity="0.92"/>

  <!-- schermo in mezzo (oro che sfuma nel blu) -->
  <path d="M 378 368 L 690 414 L 690 626 L 378 672 Z" fill="url(#mezzo)" stroke="url(#mezzo)"
        stroke-width="60" stroke-linejoin="round" opacity="0.9"/>

  <!-- schermo davanti (oro) -->
  <path d="M 494 424 L 786 456 L 786 604 L 494 636 Z" fill="url(#davanti)" stroke="url(#davanti)"
        stroke-width="64" stroke-linejoin="round" filter="url(#luce)"/>

  <!-- play -->
  <path d="M 612 482 L 690 530 L 612 578 Z" fill="#0a1233" stroke="#0a1233" stroke-width="18" stroke-linejoin="round"/>
</svg>
