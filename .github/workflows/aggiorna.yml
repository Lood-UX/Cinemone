name: Aggiorna orari

on:
  schedule:
    # Orari in UTC (ora italiana = UTC+1 d'inverno, +2 d'estate).
    # Minuti "dispari": GitHub ritarda molto le esecuzioni programmate allo scoccare dell'ora.
    # Più esecuzioni al giorno, così almeno una arriva presto la mattina anche se GitHub è in ritardo.
    - cron: "23 3 * * *"     # ~04:23 notte: orari del nuovo giorno
    - cron: "41 6 * * *"     # ~07:41 mattina
    - cron: "17 10 * * *"    # ~11:17
    - cron: "37 14 * * *"    # ~15:37
    - cron: "53 18 * * *"    # ~19:53
  workflow_dispatch: {}      # pulsante "Run workflow" per aggiornare a mano
  push:
    branches: [main]         # si rigenera anche quando modifichi config.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Genera la pagina
        run: ruby build.rb
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
